# ---------- Settings for every profile ----------
spring:
  application:
    name: gateway
  profiles:
    # If you start the app without choosing a profile, "local" is used.
    default: local
  threads:
    virtual:
      enabled: true   # each request runs on a cheap virtual thread (Java 21+)
  datasource:
    # Outside "local", these MUST come from environment variables (no secrets in the repo).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # QA4: notice a dead database in 2 s, not 30 s, so calls and refreshes do not hang during an outage.
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100   # nobody can ask for a million rows in one page

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always   # QA4: shows policyStore = UP or STALE (details stay hidden)
      probes:
        enabled: true   # adds /actuator/health/liveness and /readiness

springdoc:
  swagger-ui:
    path: /swagger-ui.html

agentgate:
  security:
    # Outside "local" these MUST come from environment variables; startup fails with a clear message if missing.
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
    access-token-ttl: 5m   # agents get a new token every 5 minutes
  policy:
    refresh-interval: 5s   # FR3: how often policies are re-read; also how fast an outage is noticed
    # QA4: while the database is down, LOW-risk calls may use the last known policies for this long. MEDIUM/HIGH fail closed.
    max-stale: ${POLICY_MAX_STALE:5m}
  audit:
    queue-capacity: 10000   # QA4: audit records kept in memory while the database is down
    retry-delay: 1s
  guards:
    # FR5 redaction: data types each clearance must NOT see. HIGH agents still see emails and phones.
    redaction-by-clearance:
      LOW: [EMAIL, PHONE, NATIONAL_ID]
      HIGH: [NATIONAL_ID]
    truncation:
      max-bytes: 8192   # results bigger than 8 KB (as JSON) are cut and the agent gets a notice
  limits:
    # FR6. Fixed windows: a minute, a UTC day, an hour. Counts live in memory of this instance (see ADR candidate).
    agent-per-minute: 60
    tool-per-minute: 120
    agent-daily-quota: 1000
    tool-daily-quota: 5000
    writes-per-hour-per-agent: 20   # blast-radius cap on WRITE calls
  resilience:
    # FR10. One circuit breaker per tool: it OPENS when at least 50% of the last 10 calls failed (needs 5 calls first),
    # stays open 15 s (the tool is hidden from agents), then lets 3 trial calls through (HALF_OPEN).
    default-timeout: 3s           # used when a tool has no timeout of its own
    sliding-window-size: 10
    minimum-calls: 5
    failure-rate-threshold: 50
    wait-in-open-state: 15s
    half-open-trial-calls: 3
  approval:
    # FR4. A HIGH-risk call waits this long for a human, then it is rejected (state EXPIRED).
    timeout: 2m
    webhook-url: ${APPROVAL_WEBHOOK_URL:}   # empty = no webhook
    approver:
      username: ${APPROVER_USERNAME:}
      password: ${APPROVER_PASSWORD:}

---
# ---------- "local" profile: safe defaults that match docker-compose.yml ----------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentgate}
    username: ${DB_USERNAME:agentgate}
    password: ${DB_PASSWORD:agentgate}

agentgate:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin-local-only}
  approval:
    webhook-url: ${APPROVAL_WEBHOOK_URL:http://localhost:8081/hooks/approvals}   # mock-tools just logs it
    approver:
      username: ${APPROVER_USERNAME:approver}
      password: ${APPROVER_PASSWORD:approver-local-only}
  # Two demo agents are created at startup in "local" only (DemoAgentSeeder).
  demo-agents:
    support-bot-secret: ${SUPPORT_BOT_SECRET:support-bot-local-secret}
    analytics-bot-secret: ${ANALYTICS_BOT_SECRET:analytics-bot-local-secret}
