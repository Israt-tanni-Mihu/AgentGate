spring:
  application:
    name: mock-tools
  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        name: shop-parcels
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # Only the ShopBD tool endpoints go into /v3/api-docs. The /admin/chaos endpoint is a test helper,
  # so it must NOT appear in the spec, otherwise FR1's OpenAPI import would turn it into a "tool".
  paths-to-match: /api/**
