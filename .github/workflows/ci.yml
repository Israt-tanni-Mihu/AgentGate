name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test (incl. ArchUnit)
    runs-on: ubuntu-latest
    # Integration tests start their own Postgres through Testcontainers (Docker is preinstalled on this runner).
    # This service container is an extra, real Postgres 16 next to them, as for a local `docker compose up`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentgate
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgate -d agentgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'        # same as <java.version> in pom.xml
          cache: maven
      # Safety net: Windows checkouts can lose the executable bit (the repo also stores it via git update-index).
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Verify (compile, unit + integration tests, ArchUnit)
        run: ./mvnw -B verify

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml refuses to start without these variables; the example values are fine for a build check.
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Build all images (no push)
        run: docker compose --profile demo build

  qa1-redteam:
    name: QA1 red-team suite (30 malicious + 200 legitimate calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the whole stack (fresh database)
        run: docker compose up --build -d --wait
      # The runner exits with 1 if any malicious call gets through or more than 5% of legitimate calls are blocked.
      # shell: bash turns on pipefail, so tee does not hide that exit code.
      - name: Run QA1
        shell: bash
        run: docker compose --profile demo run --rm -T agent-sim qa1 | tee qa1-output.md
      - name: Keep the QA1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa1-output
          path: qa1-output.md
      - name: Gateway log (only when something failed)
        if: failure()
        run: docker compose logs --tail 200 gateway
      - name: Stop the stack
        if: always()
        run: docker compose down -v
