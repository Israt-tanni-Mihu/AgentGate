# Local infrastructure for AgentGate. Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentgate-postgres
    environment:
      # Local-only defaults. Override by setting these env vars before "docker compose up".
      POSTGRES_DB: ${DB_NAME:-agentgate}
      POSTGRES_USER: ${DB_USERNAME:-agentgate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentgate}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # data survives "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
